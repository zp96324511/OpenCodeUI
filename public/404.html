<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // SPA redirect: 项目为 hash 路由，真实 404 只发生在静态资源缺失时，
      // 直接回退到应用根目录（兼容 github.io/OpenCodeUI 子路径与自定义域名根路径）。
      var dir = location.pathname.replace(/[^/]*$/, '')
      location.replace(dir || '/')
    </script>
  </head>
</html>
